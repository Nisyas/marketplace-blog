[tool.poetry]
name = "marketplace-blog"
version = "0.1.0"
description = "Блог маркетплейса на FastAPI"
authors = ["Valerii Tkachenko"]
package-mode = true

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.124.0"
uvicorn = { extras = ["standard"], version = "^0.33.0" }
python-multipart = "^0.0.9"

SQLAlchemy = "^2.0.0"
asyncpg = "^0.30.0"
alembic = "^1.15.0"

pydantic-settings = "^2.12.0"

bcrypt = "4.0.1"
passlib = { version = "^1.7.4", extras = ["bcrypt"] }
python-jose = "^3.3.0"

psycopg = { version = "^3.2.0", extras = ["binary"] }

celery = "^5.6.0"
kombu = "^5.4.0"

boto3 = "^1.36.0"

email-validator = "^2.2.0"

pytest = "^9.0.0"
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.13.0"
pre-commit = "^3.6.0"
alembic = "^1.17.2"
pytest-asyncio = "^1.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "asyncio: mark test as asyncio",
]
