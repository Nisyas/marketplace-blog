name: Lint and Code Quality

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint and Format Check
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff
    
    - name: Run ruff check (linting)
      run: ruff check app tests
    
    - name: Run ruff format check
      run: ruff format --check app tests
    
    - name: Run isort check (import sorting)
      run: |
        pip install isort
        isort --check-only app tests
    
    - name: Type checking with mypy
      run: |
        pip install mypy sqlalchemy[mypy]
        mypy app --ignore-missing-imports || true
      continue-on-error: true

  security:
    runs-on: ubuntu-latest
    name: Security Check
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
    
    - name: Run bandit (security issues)
      run: bandit -r app --skip B101,B601
      continue-on-error: true
    
    - name: Check dependencies for vulnerabilities
      run: |
        pip install poetry
        poetry export -f requirements.txt | safety check --stdin
      continue-on-error: true
